:root{
  --bg:#EEF5F3; --surface:#FFFFFF; --ink:#1E3532; --muted:#5D706D;
  --teal:#4DB8AA; --teal-deep:#2E8C80; --teal-soft:#DDF1EE;
  --hero-a:#2F7F75; --hero-b:#1E4D47; --on-hero:#FFFFFF; --line:#CFE6E2;
  --sheet:#FFFFFF; --scrim:rgba(20,40,37,.45);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101C1B; --surface:#182927; --ink:#E6F2F0; --muted:#9DB5B1;
    --teal:#5CC9BA; --teal-deep:#7FD8CC; --teal-soft:#1D3A36;
    --hero-a:#235E57; --hero-b:#13312E; --on-hero:#F2FBF9; --line:#26413D;
    --sheet:#182927; --scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101C1B; --surface:#182927; --ink:#E6F2F0; --muted:#9DB5B1;
  --teal:#5CC9BA; --teal-deep:#7FD8CC; --teal-soft:#1D3A36;
  --hero-a:#235E57; --hero-b:#13312E; --on-hero:#F2FBF9; --line:#26413D;
  --sheet:#182927; --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Frutiger LT Arabic","Readex Pro","Segoe UI",Tahoma,system-ui,sans-serif;
  font-size:17px; line-height:1.75; -webkit-font-smoothing:antialiased;
}
html[lang="tr"] body{font-family:"Readex Pro","Segoe UI",system-ui,sans-serif}
html[lang="ur"] body{font-family:"Noto Nastaliq Urdu","Readex Pro",serif; line-height:2.3; font-size:16px}
html[lang="bn"] body{font-family:"Noto Sans Bengali","Readex Pro",sans-serif}
html[lang="hi"] body{font-family:"Noto Sans Devanagari","Readex Pro",sans-serif}

.wrap{max-width:560px; margin:0 auto; padding:0 18px 40px}

/* Hero */
.hero{
  position:relative; overflow:hidden;
  background:var(--hero-b);
  color:var(--on-hero);
  border-radius:0 0 32px 32px;
  min-height:clamp(440px,68vh,600px);
  padding:22px 22px 100px;
  display:flex; flex-direction:column; justify-content:space-between;
}
.hero-photo{
  position:absolute; inset:0; width:100%; height:100%;
  object-fit:cover; object-position:72% 30%;
  animation:settle 1.6s ease-out both;
}
.hero::after{ /* keeps the photo, but makes text easy to read */
  content:""; position:absolute; inset:0; z-index:0;
  background:
    linear-gradient(180deg, rgba(14,38,35,.55) 0%, rgba(14,38,35,0) 22%),
    linear-gradient(0deg, rgba(19,52,48,.97) 0%, rgba(25,70,64,.82) 32%, rgba(25,70,64,.15) 62%, rgba(25,70,64,0) 75%);
}
@keyframes settle{from{transform:scale(1.06)}to{transform:scale(1)}}
.topbar{display:flex; align-items:center; justify-content:space-between; gap:12px; position:relative; z-index:1}
.brand{text-shadow:0 1px 10px rgba(0,0,0,.35); font-weight:700; letter-spacing:.04em; font-size:20px; font-family:"Frutiger LT Arabic","Readex Pro",sans-serif}
.lang-btn{
  -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
  display:inline-flex; align-items:center; gap:8px;
  background:rgba(255,255,255,.16); color:var(--on-hero);
  border:1px solid rgba(255,255,255,.35); border-radius:999px;
  padding:9px 16px; font:inherit; font-size:15px; line-height:1.2; cursor:pointer;
  font-family:"Readex Pro",sans-serif;
}
.lang-btn:focus-visible,.lang-opt:focus-visible{outline:3px solid #FFD68A; outline-offset:2px}
.hero-text{position:relative; z-index:1; margin-top:auto; text-shadow:0 1px 12px rgba(0,0,0,.25)}
.welcome{margin:0; font-size:16px; opacity:.9}
h1{margin:6px 0 10px; font-size:clamp(26px,7vw,34px); line-height:1.35; font-weight:600}
html[lang="ur"] h1{line-height:1.9}
.branch{margin:0; font-size:14px; opacity:.8}

/* The price disc: the one memorable element */
.price{
  position:relative; z-index:2; margin:-70px auto 0;
  background:var(--surface); border-radius:28px;
  padding:24px 22px; display:flex; align-items:center; gap:20px;
  box-shadow:0 18px 40px -22px rgba(30,77,71,.55);
}
.disc{
  flex:none; width:118px; height:118px; border-radius:50%;
  background:var(--teal); color:#fff;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  box-shadow:inset 0 0 0 7px rgba(255,255,255,.28);
}
.disc .num{font-family:"Frutiger LT Arabic","Readex Pro",sans-serif; font-size:46px; font-weight:700; line-height:1}
html[lang="bn"] .disc .num{font-family:"Noto Sans Bengali",sans-serif}
.disc .cur{font-size:15px; line-height:1.4; margin-top:4px}
html[lang="ur"] .disc .cur{line-height:1.8; margin-top:0}
.price h2{margin:0 0 4px; font-size:20px; font-weight:600; line-height:1.45}
.price p{margin:0; color:var(--muted); font-size:15px}

/* Sections */
.block{margin-top:30px; padding:0 4px}
.block h3{margin:0 0 6px; font-size:18px; font-weight:600; color:var(--teal-deep)}
.block p{margin:0; color:var(--muted)}
html[lang="ar"] .block p, html[lang="ar"] .group p, html[lang="ar"] .price p{font-size:15.5px; line-height:1.9}

.group{
  margin-top:26px; background:var(--teal-soft); border-radius:20px;
  padding:20px; display:flex; gap:14px; align-items:flex-start;
}
.group .ico{flex:none; font-size:28px; line-height:1.3}
.group h3{margin:0 0 4px; font-size:17px; font-weight:600}
.group p{margin:0; font-size:15.5px}

.thanks{
  margin-top:34px; text-align:center; font-size:18px; font-weight:500;
  padding:22px 10px; border-top:1px dashed var(--line);
}

/* Language sheet */
.scrim{position:fixed; inset:0; background:var(--scrim); opacity:0; pointer-events:none; transition:opacity .2s; z-index:20}
.sheet{
  position:fixed; inset-inline:0; bottom:0; z-index:21;
  background:var(--sheet); border-radius:26px 26px 0 0;
  max-width:560px; margin:0 auto;
  padding:14px 18px calc(20px + env(safe-area-inset-bottom,0px));
  transform:translateY(105%); visibility:hidden; transition:transform .25s ease, visibility 0s .25s;
}
.open .scrim{opacity:1; pointer-events:auto}
.open .sheet{transform:none; visibility:visible; transition:transform .25s ease}
.grab{width:44px; height:5px; border-radius:3px; background:var(--line); margin:0 auto 14px}
.sheet-title{margin:0 0 10px; font-size:15px; color:var(--muted); text-align:center; font-family:"Readex Pro",sans-serif}
.langs{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.lang-opt{
  font:inherit; cursor:pointer; text-align:center;
  background:var(--bg); color:var(--ink);
  border:1.5px solid transparent; border-radius:16px; padding:12px 8px; line-height:1.5;
}
.lang-opt[aria-pressed="true"]{border-color:var(--teal); background:var(--teal-soft)}
.lang-opt .n{display:block; font-size:17px; font-weight:600}
.lang-opt .e{display:block; font-size:12.5px; color:var(--muted); font-family:"Readex Pro",sans-serif}
.lang-opt[data-l="ur"] .n{font-family:"Noto Nastaliq Urdu",serif; line-height:2}
.lang-opt[data-l="bn"] .n{font-family:"Noto Sans Bengali",sans-serif}
.lang-opt[data-l="hi"] .n{font-family:"Noto Sans Devanagari",sans-serif}

@media (prefers-reduced-motion: reduce){ .sheet,.scrim{transition:none} .hero-photo{animation:none} }
@media (max-width:380px){
  .price{flex-direction:column; text-align:center}
}
</style>
</head>

const ORDER = ["ar","en","ur","hi","bn","id","tr","fr"];

const langsEl = document.getElementById("langs");
ORDER.forEach(code=>{
  const b = document.createElement("button");
  b.className = "lang-opt"; b.dataset.l = code; b.lang = code;
  b.innerHTML = `<span class="n">${T[code].name}</span><span class="e">${T[code].en}</span>`;
  b.addEventListener("click",()=>{ setLang(code); closeSheet(); });
  langsEl.appendChild(b);
});

function setLang(code){
  const t = T[code] || T.ar;
  document.documentElement.lang = code;
  document.documentElement.dir = t.dir;
  document.querySelectorAll("[data-k]").forEach(el=>{ el.textContent = t[el.dataset.k]; });
  document.getElementById("langBtnLabel").textContent = code === "ar" ? "Language" : t.btn;
  document.title = t.brand + " | " + t.title;
  langsEl.querySelectorAll(".lang-opt").forEach(b=>b.setAttribute("aria-pressed", b.dataset.l === code));
  try{ localStorage.setItem("kiffa-lang", code); }catch(e){}
}

const layer = document.getElementById("langLayer");
const btn = document.getElementById("langBtn");
function openSheet(){ layer.classList.add("open"); const cur = langsEl.querySelector('[aria-pressed="true"]'); (cur||langsEl.firstChild).focus(); }
function closeSheet(){ layer.classList.remove("open"); btn.focus(); }
btn.addEventListener("click", openSheet);
document.getElementById("scrim").addEventListener("click", closeSheet);
document.addEventListener("keydown", e=>{ if(e.key === "Escape" && layer.classList.contains("open")) closeSheet(); });

// Start with saved choice, else visitor's device language, else Arabic
let start = "ar";
try{ const saved = localStorage.getItem("kiffa-lang"); if(saved && T[saved]) start = saved; else throw 0; }
catch(e){
  const nav = (navigator.languages || [navigator.language || "ar"]).map(l=>l.slice(0,2).toLowerCase());
  const hit = nav.find(l=>T[l]); if(hit) start = hit;
}
setLang(start);
</script>
